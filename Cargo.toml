[package]
name = "hq"
version = "0.1.0"
edition = "2021"
description = "In-house Aikido HQ: Enroll Targets, run Engines, Gate PRs, open Remediations"
license = "MIT"

[[bin]]
name = "hq"
path = "src/bin/hq.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
tempfile = "3.10"
